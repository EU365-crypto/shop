<script>
const itemSearch = document.getElementById('store-item-search');
const openItemSearch = () => { location.href = '/search.html?q=' + encodeURIComponent(itemSearch.value) + (new URLSearchParams(location.search).get('adminView') === '1' ? '&adminView=1' : ''); };
itemSearch.addEventListener('focus', openItemSearch);
itemSearch.addEventListener('input', openItemSearch);
document.addEventListener('languagechange', () => {
    itemSearch.setAttribute('aria-label', translateText('Search items'));
    displayProducts();
});
</script>


<script>

async function checkLogin() {

    try {

        const response =
            await fetch(new URLSearchParams(location.search).get('adminView') === '1' ? '/api/admin/me' : '/api/me');

        const data =
            await response.json();
        document.body.dataset.customerSignedIn = String(Boolean(data.loggedIn && data.user.role !== 'admin'));
        document.getElementById('menu-logout').hidden = !data.loggedIn;
        document.getElementById('admin-store-email-link').style.display = data.loggedIn && data.user.role === 'admin' ? 'inline-flex' : 'none';



        const signIn =
            document.getElementById(
                "signin-link"
            );



        const account =
            document.getElementById(
                "account-link"
            );

        const adminManage =
            document.getElementById(
                "admin-manage-link"
            );




        /* NOT LOGGED IN */

        document.getElementById("user-email-link").style.display = data.loggedIn && data.user.role !== "admin" ? "inline-flex" : "none";
        setAccountGreeting(account, data.loggedIn ? data.user.firstName : "");
        const greeting = document.getElementById('menu-account-greeting');
        setAccountGreeting(greeting, data.loggedIn ? data.user.firstName : '');

        if (!data.loggedIn) {

            signIn.style.display =
                "inline";

            account.style.display =
                "none";

            adminManage.style.display =
                "none";



            return;

        }


        /* LOGGED IN */

        signIn.style.display =
            "none";




        /* ADMIN */

        if (
            data.user.role === "admin"
        ) {

            adminManage.style.display =
                "inline-flex";

            account.style.display =
                "none";

        }


        /* NORMAL USER */

        else {

            adminManage.style.display =
                "none";

            account.style.display =
                "inline-flex";

        }

    }

    catch (error) {

        console.error(
            "Login check failed:",
            error
        );

    }

}




checkLogin();

</script>
