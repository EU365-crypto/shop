<script>
(() => {
    const background = document.querySelector('.welcome-market-animation');
    if (background && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        for (const item of [...background.children]) {
            const style = getComputedStyle(item);
            const duration = parseFloat(style.animationDuration);
            const delay = parseFloat(style.animationDelay) || 0;
            for (let offset = 1; offset <= 2; offset++) {
                const copy = item.cloneNode(true);
                copy.style.animationDelay = (delay - duration * offset / 3) + 's';
                background.appendChild(copy);
            }
        }
    }
})();
</script>
